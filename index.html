<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b100e"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Balance">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png">
<title>Balance — личные финансы</title>
<style>
:root{color-scheme:dark;--bg:#090d0b;--s:#121a15;--s2:#1a261e;--line:#26332b;--txt:#f1f6f2;--muted:#91a197;--green:#a8e6bd;--red:#ff7777;--r:22px;--nav:72px;--safe:env(safe-area-inset-bottom,0px);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0 auto;max-width:680px;min-height:100vh;background:var(--bg);color:var(--txt);padding-bottom:calc(var(--nav) + var(--safe) + 20px)}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;padding:calc(13px + env(safe-area-inset-top,0px)) 21px 13px;display:flex;align-items:center;justify-content:space-between;background:#090d0bdc;backdrop-filter:blur(20px)}.kicker,.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:750}h1{font-size:27px;letter-spacing:-.7px;margin:3px 0 0}h2{font-size:18px;margin:0;letter-spacing:-.3px}p{color:var(--muted);font-size:13px;line-height:1.5}main{padding:12px 20px 26px;animation:in .25s ease}.section{margin-bottom:23px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.card{background:linear-gradient(145deg,#18251d,#111914);border:1px solid #29372e;border-radius:var(--r);padding:19px}.hero{padding:23px 20px 18px;background:radial-gradient(ellipse at 100% 0%,#a8e6bd20,transparent 48%),linear-gradient(145deg,#1b3023,#121a15);border-color:#355341}.balance{font-size:clamp(34px,9vw,47px);font-weight:800;letter-spacing:-1.6px;margin:13px 0 21px;overflow-wrap:anywhere}.stats,.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border-radius:15px;background:#ffffff09;border:1px solid #ffffff0c}.stat small,.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.stat b{font-size:16px}.positive{color:var(--green)}.negative{color:var(--red)}.metric{padding:16px;border-radius:18px;background:var(--s);border:1px solid var(--line)}.metric strong{font-size:20px;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{min-height:83px;padding:12px;border-radius:17px;border:1px solid var(--line);background:var(--s);color:var(--txt);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;font-size:12px;font-weight:700;transition:.18s}.action:active,.btn:active,.icon-btn:active{transform:scale(.97)}.action-ico,.item-ico{width:34px;height:34px;border-radius:12px;background:#a8e6bd16;color:var(--green);display:grid;place-items:center}.ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.icon-btn{width:43px;height:43px;border-radius:15px;border:1px solid var(--line);background:var(--s);color:var(--muted);display:grid;place-items:center}.text-btn{border:0;background:none;color:var(--green);font-size:12px;font-weight:700;padding:7px 0}
.chart-card{padding:15px}.chart{width:100%;height:140px;display:block}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.legend{display:flex;gap:14px;color:var(--muted);font-size:11px;margin-top:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.dot.red{background:var(--red)}
.list{padding:4px 15px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 1px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item-left{display:flex;align-items:center;gap:11px;min-width:0}.item-ico{width:40px;height:40px;flex:0 0 40px}.item-info{min-width:0}.item-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:205px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.amount{font-size:13px;font-weight:750;white-space:nowrap}.empty{text-align:center;padding:27px 12px;color:var(--muted);font-size:13px;line-height:1.5}
.progress{height:7px;background:#2a382e;border-radius:99px;overflow:hidden;margin:12px 0 8px}.progress span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}.progress.red span{background:var(--red)}.between{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.badge{padding:5px 8px;border-radius:99px;background:#a8e6bd16;color:var(--green);font-size:10px;font-weight:750}.badge.red{background:#ff77771a;color:var(--red)}
.filter{display:flex;gap:8px;overflow:auto;margin:10px 0 12px}.chip{border:1px solid var(--line);background:var(--s);color:var(--muted);border-radius:99px;padding:8px 13px;font-size:11px;white-space:nowrap}.chip.active{color:var(--green);border-color:#527b5f;background:#a8e6bd14}.search{position:relative;margin-bottom:10px}.search .ico{position:absolute;left:13px;top:14px;color:var(--muted)}input,select{width:100%;background:#0c120f;color:var(--txt);border:1px solid #344238;border-radius:14px;padding:14px;font-size:15px;outline:none}input:focus,select:focus{border-color:var(--green)}label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin:14px 0 7px}.btn{width:100%;border:0;border-radius:15px;padding:15px;margin-top:16px;background:var(--green);color:#0a130d;font-size:14px;font-weight:800}.btn.secondary{background:var(--s2);border:1px solid var(--line);color:var(--txt)}.btn.danger{background:#ff77771a;color:var(--red);border:1px solid #ff777733}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.nav{position:fixed;z-index:40;bottom:0;left:0;right:0;max-width:680px;margin:auto;height:calc(var(--nav) + var(--safe));padding:8px 8px calc(7px + var(--safe));display:grid;grid-template-columns:repeat(5,1fr);background:#0c120fe8;border-top:1px solid var(--line);backdrop-filter:blur(22px)}.nav button{border:0;background:none;color:#7e9085;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:650}.nav button.active{color:var(--green)}.nav .ico{width:21px;height:21px}.nav .add{width:42px;height:42px;border-radius:15px;background:var(--green);color:#102016;margin-top:-6px}.overlay{position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}.overlay.show{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:81;bottom:0;left:0;right:0;max-width:680px;margin:auto;max-height:92dvh;overflow:auto;padding:12px 20px calc(23px + var(--safe));border:1px solid var(--line);border-bottom:0;border-radius:27px 27px 0 0;background:#121a15;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}.sheet.show{transform:translateY(0)}.handle{width:38px;height:4px;background:#405046;border-radius:9px;margin:2px auto 19px}.sheet-head{display:flex;align-items:center;justify-content:space-between}.display-amount{text-align:center;font-size:42px;font-weight:800;padding:12px}.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.num{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--s2);color:var(--txt);font-size:20px}.toast{position:fixed;z-index:120;bottom:calc(var(--nav) + var(--safe) + 13px);left:50%;transform:translate(-50%,12px);opacity:0;background:#e5f5e9;color:#102016;padding:11px 16px;border-radius:99px;font-size:12px;font-weight:750;transition:.2s;white-space:nowrap;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<header><div><div class="kicker">Личные финансы</div><h1 id="title">Обзор</h1></div><button class="icon-btn" onclick="switchTab('more')" aria-label="Настройки"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7 7 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2.6-1.5L13.5 3h-4L9 5a7 7 0 0 0-2.6 1.5L4 5.5 2 9l2 1.5a7 7 0 0 0 0 3L2 15l2 3.5 2.4-1A7 7 0 0 0 9 19l.5 2h4l.5-2a7 7 0 0 0 2.6-1.5l2.4 1 2-3.5z"/></svg></button></header>
<main id="app"></main>
<div class="overlay" id="overlay" onclick="closeSheets()"></div>
<section class="sheet" id="sheet-tx" role="dialog" aria-modal="true"><div class="handle"></div><div class="sheet-head"><span class="eyebrow" id="tx-title">Новая операция</span><button class="icon-btn" onclick="closeSheets()">✕</button></div><div class="display-amount" id="display">0 ₽</div><div class="numpad">
<button class="num" onclick="numpad('1')">1</button><button class="num" onclick="numpad('2')">2</button><button class="num" onclick="numpad('3')">3</button><button class="num" onclick="numpad('4')">4</button><button class="num" onclick="numpad('5')">5</button><button class="num" onclick="numpad('6')">6</button><button class="num" onclick="numpad('7')">7</button><button class="num" onclick="numpad('8')">8</button><button class="num" onclick="numpad('9')">9</button><button class="num" onclick="numpad(',')">,</button><button class="num" onclick="numpad('0')">0</button><button class="num" onclick="numpad('del')">⌫</button></div>
<form id="tx-form" onsubmit="saveTx(event)"><input type="hidden" name="type"><input type="hidden" name="amount"><label>Название</label><input name="title" maxlength="60" placeholder="Например, продукты" required><div class="form-grid"><div><label>Категория</label><select name="category" id="category"></select></div><div><label>Дата</label><input type="date" name="date" required></div></div><label>Комментарий</label><input name="note" maxlength="120" placeholder="Необязательно"><button class="btn">Сохранить операцию</button></form></section>
<section class="sheet" id="sheet-form"><div class="handle"></div><div class="sheet-head"><h2 id="form-title">Добавить</h2><button class="icon-btn" onclick="closeSheets()">✕</button></div><div id="form-content"></div></section>
<nav class="nav"><button class="active" data-tab="home" onclick="switchTab('home')"><svg class="ico" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z"/></svg>Обзор</button><button data-tab="tx" onclick="switchTab('tx')"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h10"/></svg>Операции</button><button onclick="openTxSheet('expense')" aria-label="Добавить"><span class="add"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button><button data-tab="plan" onclick="switchTab('plan')"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M7 15l4-4 3 2 5-6"/></svg>План</button><button data-tab="more" onclick="switchTab('more')"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>Ещё</button></nav><div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='balance_app_v3',OLD=['balance_pro_v2','balance_app_v1'];
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},month=()=>today().slice(0,7),uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now().toString(36);
const fresh=()=>({currency:'₽',transactions:[],budgets:[],debts:[],goals:[],settings:{startBalance:0}});
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)for(let k of OLD){raw=localStorage.getItem(k);if(raw)break}if(!raw)return fresh();let x=JSON.parse(raw),d=fresh();return {...d,...x,settings:{...d.settings,...x.settings},transactions:Array.isArray(x.transactions)?x.transactions:[],budgets:Array.isArray(x.budgets)?x.budgets:[],debts:Array.isArray(x.debts)?x.debts:[],goals:Array.isArray(x.goals)?x.goals:[]}}catch(e){console.error(e);return fresh()}}
let state=load(),tab='home',num='0',filter='all',query='';
const cats={income:['Зарплата','Подработка','Подарок','Инвестиции','Продажа','Другое'],expense:['Продукты','Жильё','Транспорт','Покупки','Здоровье','Развлечения','Связь','Кредиты','Образование','Кафе','Подписки','Путешествия','Другое']};
const symbols={'Продукты':'🛒','Жильё':'⌂','Транспорт':'↗','Покупки':'◇','Здоровье':'＋','Развлечения':'☆','Связь':'▣','Кредиты':'▤','Зарплата':'↗','Подработка':'⌘','Подарок':'✧','Инвестиции':'⌁','Продажа':'◇','Образование':'▤','Кафе':'☕','Подписки':'↻','Путешествия':'✈','Другое':'•'};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' '+state.currency}
function total(type,m=month()){return state.transactions.filter(t=>t.type===type&&String(t.date).startsWith(m)).reduce((a,t)=>a+Number(t.amount||0),0)}
function balance(){return state.transactions.reduce((a,t)=>a+(t.type==='income'?1:-1)*Number(t.amount||0),Number(state.settings.startBalance)||0)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));render();return true}catch(e){toast('Не удалось сохранить данные');return false}}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function date(s){return s?`${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}`:''}
function empty(s,sub=''){return `<div class="empty">${esc(s)}${sub?`<br><span>${esc(sub)}</span>`:''}</div>`}
function txItem(t){let inc=t.type==='income';return `<div class="item"><div class="item-left"><div class="item-ico">${symbols[t.category]||'•'}</div><div class="item-info"><div class="item-title">${esc(t.title||t.category)}</div><div class="meta">${esc(t.category||'Другое')} · ${date(t.date)}${t.note?' · '+esc(t.note):''}</div></div></div><div class="amount ${inc?'positive':'negative'}">${inc?'+':'−'}${money(t.amount)}</div></div>`}
function chart(){let ds=[];let now=new Date();for(let i=5;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1),m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;ds.push({label:d.toLocaleDateString('ru-RU',{month:'short'}),a:total('income',m),b:total('expense',m)})}let max=Math.max(1,...ds.flatMap(x=>[x.a,x.b])),coords=k=>ds.map((x,i)=>`${8+i*60},${125-(x[k]/max)*110}`).join(' ');return `<svg class="chart" viewBox="0 0 320 135" preserveAspectRatio="none"><polyline points="${coords('a')}" fill="none" stroke="#a8e6bd" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linecap="round"/><polyline points="${coords('b')}" fill="none" stroke="#ff7777" stroke-width="2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/></svg><div class="chart-labels">${ds.map(x=>`<span>${x.label}</span>`).join('')}</div><div class="legend"><span><i class="dot"></i>Доходы</span><span><i class="dot red"></i>Расходы</span></div>`}
function home(){let inc=total('income'),exp=total('expense'),recent=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4),debt=state.debts.reduce((a,x)=>a+Number(x.remaining||0),0),saved=state.goals.reduce((a,x)=>a+Number(x.saved||0),0);return `<section class="section card hero"><div class="eyebrow">Общий баланс</div><div class="balance">${money(balance())}</div><div class="stats"><div class="stat"><small>Доходы за месяц</small><b class="positive">+${money(inc)}</b></div><div class="stat"><small>Расходы за месяц</small><b class="negative">−${money(exp)}</b></div></div></section><section class="section two"><div class="metric"><small>Кредиты и долги</small><strong>${money(debt)}</strong></div><div class="metric"><small>Накоплено на цели</small><strong>${money(saved)}</strong></div></section><section class="section"><div class="head"><h2>Быстрые действия</h2></div><div class="actions"><button class="action" onclick="openTxSheet('income')"><span class="action-ico">↗</span>Добавить доход</button><button class="action" onclick="openTxSheet('expense')"><span class="action-ico">↘</span>Добавить расход</button><button class="action" onclick="openForm('goal')"><span class="action-ico">◎</span>Новая цель</button></div></section><section class="section"><div class="head"><h2>Динамика</h2><span class="eyebrow">6 месяцев</span></div><div class="card chart-card">${chart()}</div></section><section class="section"><div class="head"><h2>Последние операции</h2><button class="text-btn" onclick="switchTab('tx')">Все →</button></div><div class="card list">${recent.length?recent.map(txItem).join(''):empty('Операций пока нет','Добавьте первую запись')}</div></section>`}
function txList(){let a=[...state.transactions].sort((x,y)=>y.date.localeCompare(x.date));if(filter!=='all')a=a.filter(x=>x.type===filter);if(query)a=a.filter(x=>[x.title,x.category,x.note].join(' ').toLowerCase().includes(query.toLowerCase()));return `<section class="section"><div class="search"><input placeholder="Поиск операций" value="${esc(query)}" oninput="query=this.value;renderTxOnly()"></div><div class="filter"><button class="chip ${filter==='all'?'active':''}" onclick="setFilter('all')">Все</button><button class="chip ${filter==='income'?'active':''}" onclick="setFilter('income')">Доходы</button><button class="chip ${filter==='expense'?'active':''}" onclick="setFilter('expense')">Расходы</button></div><div class="card list">${a.length?a.map(txItem).join(''):empty('Операции не найдены')}</div></section>`}
function plan(){let b=state.budgets.find(x=>x.category==='Все расходы'),spent=total('expense'),pct=b&&b.limit?Math.min(100,spent/b.limit*100):0;let budget=b?`<div class="card"><div class="head"><div><div class="eyebrow">Месячный лимит</div><h2 style="margin-top:6px">${money(b.limit)}</h2></div><span class="badge ${pct>=90?'red':''}">${Math.round(pct)}%</span></div><div class="progress ${pct>=90?'red':''}"><span style="width:${pct}%"></span></div><div class="between"><span>Потрачено ${money(spent)}</span><span>Остаток ${money(Math.max(0,b.limit-spent))}</span></div><button class="text-btn" onclick="openForm('budget')">Изменить лимит</button></div>`:`<div class="card">${empty('Месячный лимит не задан')}<button class="btn secondary" onclick="openForm('budget')">Установить бюджет</button></div>`;let goals=state.goals.map(g=>{let p=g.target?Math.min(100,g.saved/g.target*100):0;return `<div class="card" style="margin-bottom:10px"><div class="head"><b>${esc(g.name)}</b><span class="badge">${Math.round(p)}%</span></div><div class="progress"><span style="width:${p}%"></span></div><div class="between"><span>${money(g.saved)}</span><span>из ${money(g.target)}</span></div><div class="between" style="margin-top:10px"><button class="text-btn" onclick="addGoal('${g.id}')">＋ Пополнить</button><button class="text-btn" onclick="editGoal('${g.id}')">Изменить</button><button class="text-btn" style="color:var(--red)" onclick="removeRecord('goals','${g.id}')">Удалить</button></div></div>`}).join('');let debts=state.debts.map(d=>`<div class="item"><div class="item-left"><div class="item-ico">▤</div><div><b class="item-title">${esc(d.name)}</b><div class="meta">Платёж ${money(d.payment)}</div></div></div><div style="text-align:right"><b class="amount">${money(d.remaining)}</b><br><button class="text-btn" onclick="editDebt('${d.id}')">Изменить</button></div></div>`).join('');return `<section class="section"><div class="head"><h2>Бюджет</h2></div>${budget}</section><section class="section"><div class="head"><h2>Финансовые цели</h2><button class="text-btn" onclick="openForm('goal')">＋ Добавить</button></div>${goals||`<div class="card">${empty('Целей пока нет','Создайте цель накопления')}</div>`}</section><section class="section"><div class="head"><h2>Кредиты и долги</h2><button class="text-btn" onclick="openForm('debt')">＋ Добавить</button></div><div class="card list">${debts||empty('Нет активных долгов')}</div></section>`}
function more(){return `<section class="section card"><div class="head"><h2>Настройки</h2></div><div class="setting"><div><b>Валюта</b><div class="meta">Валюта отображения</div></div><button class="text-btn" onclick="openForm('settings')">${esc(state.currency)} · Изменить</button></div><div class="setting"><div><b>Стартовый баланс</b><div class="meta">Начальная сумма</div></div><b>${money(state.settings.startBalance)}</b></div></section><section class="section"><div class="head"><h2>Управление данными</h2></div><div class="card"><button class="btn secondary" style="margin:0" onclick="exportData()">Экспорт резервной копии</button><button class="btn secondary" onclick="document.getElementById('import').click()">Импорт резервной копии</button><input id="import" type="file" accept=".json,application/json" hidden onchange="importData(event)"><button class="btn danger" onclick="clearData()">Удалить все данные</button></div></section><section class="section card"><div class="eyebrow">О приложении</div><h2 style="margin:7px 0">Balance</h2><p>Персональный финансовый менеджер. Данные хранятся локально в браузере на этом устройстве. Подключения к банкам и отправки данных на сервер нет.</p><div class="setting"><span class="meta">Версия</span><span class="meta">4.0 · Offline</span></div></section>`}
function render(){document.getElementById('title').textContent=({home:'Обзор',tx:'Операции',plan:'Планирование',more:'Ещё'})[tab];document.getElementById('app').innerHTML=({home,tx:txList,plan,more})[tab]();document.querySelectorAll('.nav button[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab))}
function renderTxOnly(){let y=scrollY;document.getElementById('app').innerHTML=txList();scrollTo(0,y)}
function setFilter(x){filter=x;render()}
function switchTab(x){tab=x;render();scrollTo({top:0,behavior:'smooth'})}
function openSheet(id){document.getElementById('overlay').classList.add('show');document.getElementById(id).classList.add('show');document.body.style.overflow='hidden'}
function closeSheets(){document.getElementById('overlay').classList.remove('show');document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('show'));document.body.style.overflow='';num='0';updateNum()}
function openTxSheet(type){let f=document.getElementById('tx-form');f.reset();f.elements.type.value=type;f.elements.date.value=today();document.getElementById('tx-title').textContent=type==='income'?'Новый доход':'Новый расход';document.getElementById('category').innerHTML=cats[type].map(x=>`<option>${esc(x)}</option>`).join('');num='0';updateNum();openSheet('sheet-tx')}
function numpad(v){if(v==='del')num=num.slice(0,-1)||'0';else if(v===','){if(!num.includes(','))num+=','}else if(num==='0')num=v;else if(num.replace(',','').length<12)num+=v;updateNum()}
function updateNum(){document.getElementById('display').textContent=num+' '+state.currency;document.querySelector('#tx-form [name=amount]').value=num.replace(',','.')}
function saveTx(e){e.preventDefault();let f=e.target,n=Number(f.elements.amount.value);if(!Number.isFinite(n)||n<=0)return toast('Введите корректную сумму');state.transactions.push({id:uid(),type:f.elements.type.value,title:f.elements.title.value.trim(),amount:n,date:f.elements.date.value,category:f.elements.category.value,note:f.elements.note.value.trim()});save();closeSheets();toast('Операция сохранена')}
function openForm(type,rec=null){let title=document.getElementById('form-title'),c=document.getElementById('form-content');if(type==='goal'){title.textContent=rec?'Изменить цель':'Новая цель';c.innerHTML=`<form onsubmit="saveGoal(event,'${rec?.id||''}')"><label>Название</label><input name="name" required maxlength="60" value="${esc(rec?.name||'')}" placeholder="Отпуск, автомобиль..."><label>Целевая сумма</label><input name="target" type="number" min=".01" step=".01" required value="${rec?.target??''}"><label>Уже накоплено</label><input name="saved" type="number" min="0" step=".01" value="${rec?.saved??0}"><button class="btn">Сохранить цель</button></form>`}else if(type==='budget'){let b=state.budgets.find(x=>x.category==='Все расходы');title.textContent='Месячный бюджет';c.innerHTML=`<form onsubmit="saveBudget(event)"><label>Лимит (${state.currency})</label><input name="limit" type="number" min=".01" step=".01" required value="${b?.limit??''}"><button class="btn">Сохранить лимит</button></form>`}else if(type==='debt'){title.textContent=rec?'Изменить долг':'Новый кредит или долг';c.innerHTML=`<form onsubmit="saveDebt(event,'${rec?.id||''}')"><label>Название</label><input name="name" required maxlength="60" value="${esc(rec?.name||'')}"><label>Остаток долга</label><input name="remaining" type="number" min="0" step=".01" required value="${rec?.remaining??''}"><label>Ежемесячный платёж</label><input name="payment" type="number" min="0" step=".01" required value="${rec?.payment??''}"><button class="btn">Сохранить</button></form>`}else{title.textContent='Настройки';c.innerHTML=`<form onsubmit="saveSettings(event)"><label>Валюта</label><select name="currency">${['₽','€','$','₸','₴','£','¥','CHF','Kč','zł'].map(x=>`<option ${state.currency===x?'selected':''}>${x}</option>`).join('')}</select><label>Стартовый баланс</label><input name="startBalance" type="number" step=".01" value="${Number(state.settings.startBalance)||0}"><button class="btn">Сохранить настройки</button></form>`}openSheet('sheet-form')}
function saveGoal(e,rid=''){e.preventDefault();let f=e.target,o={name:f.elements.name.value.trim(),target:Number(f.elements.target.value),saved:Number(f.elements.saved.value)||0};if(o.target<=0||o.saved<0)return toast('Проверьте суммы');if(rid)Object.assign(state.goals.find(x=>x.id===rid),o);else state.goals.push({id:uid(),...o});save();closeSheets();toast('Цель сохранена')}
function saveBudget(e){e.preventDefault();let n=Number(e.target.elements.limit.value);if(n<=0)return toast('Лимит должен быть больше нуля');state.budgets=state.budgets.filter(x=>x.category!=='Все расходы');state.budgets.push({id:uid(),category:'Все расходы',limit:n});save();closeSheets()}
function saveDebt(e,rid=''){e.preventDefault();let f=e.target,o={name:f.elements.name.value.trim(),remaining:Number(f.elements.remaining.value),payment:Number(f.elements.payment.value)};if(rid)Object.assign(state.debts.find(x=>x.id===rid),o);else state.debts.push({id:uid(),...o});save();closeSheets()}
function saveSettings(e){e.preventDefault();state.currency=e.target.elements.currency.value;state.settings.startBalance=Number(e.target.elements.startBalance.value)||0;save();closeSheets()}
function addGoal(gid){let g=state.goals.find(x=>x.id===gid),v=prompt(`Сколько добавить к цели «${g.name}»?`);if(v===null)return;let n=Number(v.replace(',','.'));if(!Number.isFinite(n)||n<=0)return toast('Введите корректную сумму');g.saved=Number(g.saved||0)+n;save();toast('Цель пополнена')}
function editGoal(id){let x=state.goals.find(x=>x.id===id);if(x)openForm('goal',x)}function editDebt(id){let x=state.debts.find(x=>x.id===id);if(x)openForm('debt',x)}
function removeRecord(key,id){if(!confirm('Удалить эту запись?'))return;state[key]=state[key].filter(x=>x.id!==id);save()}
function exportData(){let blob=new Blob([JSON.stringify({app:'Balance',version:4,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`balance-backup-${today()}.json`;a.click();URL.revokeObjectURL(url);toast('Резервная копия готова')}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),v=x.state||x;if(!Array.isArray(v.transactions))throw 0;if(!confirm('Импорт заменит текущие данные. Продолжить?'))return;let d=fresh();state={...d,...v,settings:{...d.settings,...v.settings}};save();toast('Данные импортированы')}catch(_){toast('Файл резервной копии повреждён или неверен')}e.target.value=''};r.readAsText(f)}
function clearData(){if(!confirm('Удалить все операции, цели, бюджеты и долги? Это нельзя отменить. Сначала рекомендуется сделать экспорт.'))return;state=fresh();save();toast('Данные очищены')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets()});render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script></body></html>
