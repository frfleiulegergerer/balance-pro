<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b100e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Баланс"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><title>Баланс</title><style>
:root{--bg:#0b100e;--p:#121a15;--p2:#1a261e;--line:#29372e;--t:#f1f6f2;--m:#91a197;--g:#a8e6bd;--r:#ff8989;--rad:21px}*{box-sizing:border-box}body{margin:0 auto;max-width:760px;background:radial-gradient(ellipse at 50% -15%,#20382a,var(--bg) 50%);color:var(--t);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{color:inherit;cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px}.brand{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#baf0ca,#6eb98b);display:grid;place-items:center;color:#102016;font-weight:900;font-size:21px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--m);font-weight:700}.brand b{font-size:20px}.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--p2);border:1px solid var(--line)}h1{font-size:28px;letter-spacing:-1px;margin:3px 0}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}.muted,.tiny{color:var(--m)}.tiny{font-size:11px}.sub{font-size:13px;color:var(--m)}.hero{margin:16px 0 13px;padding:22px;border-radius:27px;border:1px solid #3c6248;background:linear-gradient(135deg,#23402e,#17291f 70%);box-shadow:0 18px 50px #0005}.hero .balance{font-size:clamp(35px,9vw,44px);font-weight:800;letter-spacing:-1.7px;margin:7px 0 18px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hstat{background:#ffffff0b;border:1px solid #ffffff16;border-radius:16px;padding:12px}.hstat b{display:block;margin-top:4px;font-size:16px}.positive{color:var(--g)}.negative{color:var(--r)}.section{margin:23px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.link{border:0;background:none;color:var(--g);font-size:13px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:13px 3px 11px;display:flex;align-items:center;flex-direction:column;gap:8px;font-size:11px;color:#c8d6cd}.qicon{width:35px;height:35px;border-radius:12px;background:#24342a;color:var(--g);display:grid;place-items:center;font-size:20px}.metric,.panel{background:var(--p);border:1px solid var(--line);border-radius:var(--rad);padding:16px}.metric strong{display:block;font-size:20px;margin-top:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--p);border:1px solid var(--line);border-radius:17px;padding:12px}.left{display:flex;align-items:center;gap:11px;min-width:0}.avatar{width:39px;height:39px;border-radius:14px;background:#23332a;color:var(--g);display:grid;place-items:center;flex:none}.title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:var(--m);margin-top:2px}.amount{font-weight:750;white-space:nowrap}.progress{height:7px;background:#2a382f;border-radius:20px;overflow:hidden;margin:10px 0 7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#72c58d,#c2f0ce);border-radius:20px;transition:width .5s}.progress.red i{background:linear-gradient(90deg,#c85f65,#ffaaaa)}.nav{position:fixed;z-index:9;bottom:0;left:0;right:0;max-width:760px;margin:auto;display:flex;justify-content:space-around;background:#0d1411ed;backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:9px 4px calc(9px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#819288;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:52px}.nav button.active{color:var(--g)}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--g);color:#102016;font-weight:750}.btn.secondary{background:var(--p2);border:1px solid var(--line);color:var(--t)}.btn.small{font-size:12px;padding:9px 12px}.linkbtn{background:none;border:0;color:var(--g);font-size:12px}.segment{display:flex;background:#0d1511;border:1px solid var(--line);padding:4px;border-radius:13px;margin:16px 0 12px}.segment button{flex:1;border:0;background:none;color:var(--m);padding:9px;border-radius:9px;font-size:12px}.segment button.active{background:#2a3c30;color:var(--g)}input,select{width:100%;background:#0d1511;border:1px solid var(--line);color:var(--t);border-radius:13px;padding:13px;outline:none}label{display:block;font-size:12px;color:var(--m);margin:13px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;margin-top:18px}.actions>*{flex:1}.empty{border:1px dashed var(--line);border-radius:17px;padding:25px 12px;text-align:center;color:var(--m);font-size:13px}.chart{height:130px;display:flex;align-items:end;gap:8px;padding-top:12px}.barcol{height:100%;flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:6px}.bar{width:26px;max-width:90%;background:linear-gradient(#b7edc6,#5f9e75);border-radius:7px 7px 3px 3px;min-height:3px}.barlabel{font-size:9px;color:var(--m)}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:end;backdrop-filter:blur(5px)}.modal.show{display:flex;animation:fade .18s}.sheet{width:100%;max-width:760px;margin:auto;background:#141d18;border:1px solid #34443a;border-radius:25px 25px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:rise .24s}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.close{width:32px;height:32px;border:0;border-radius:50%;background:#29372e;font-size:20px}.toast{position:fixed;z-index:40;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;background:#dff4e5;color:#102016;padding:11px 16px;border-radius:13px;font-size:13px;font-weight:700;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.fade{animation:up .3s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head><body>
<header class="top"><div class="brand"><div class="mark">B</div><div><div class="eyebrow">PERSONAL FINANCE</div><b>Баланс</b></div></div><button class="iconbtn" onclick="settings()">⚙</button></header><main id="app"></main>
<nav class="nav"><button data-tab="home" onclick="tab('home')">⌂<span>Обзор</span></button><button data-tab="transactions" onclick="tab('transactions')">↕<span>Операции</span></button><button data-tab="budgets" onclick="tab('budgets')">▤<span>Бюджеты</span></button><button data-tab="debts" onclick="tab('debts')">▣<span>Кредиты</span></button><button data-tab="more" onclick="tab('more')">◎<span>Ещё</span></button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h2 id="mtitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mbody"></div></div></div><div class="toast" id="toast"></div>
<script>
const K='balance_app_v1',K2='balance_pro_v2',today=()=>new Date().toISOString().slice(0,10),month=()=>today().slice(0,7),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const fresh=()=>({version:2,currency:'₽',transactions:[],debts:[],goals:[],budgets:[],recurring:[],salary:{amount:0,date:5,frequency:'monthly'},settings:{startBalance:0}});
function load(){try{let n=JSON.parse(localStorage.getItem(K2));if(n)return n;let o=JSON.parse(localStorage.getItem(K));if(o){let s=fresh();s.currency=o.currency||'₽';s.transactions=(o.transactions||[]).map(x=>({...x,id:x.id||uid()}));s.debts=(o.debts||[]).map(x=>({...x,id:uid()}));s.goals=(o.goals||[]).map(x=>({...x,id:uid()}));if(o.monthlyBudget)s.budgets=[{id:uid(),category:'Все расходы',limit:o.monthlyBudget}];localStorage.setItem(K2,JSON.stringify(s));return s}}catch(e){}return fresh()}
let S=load(),T='home',F='month';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(+n||0)+' '+S.currency,mt=()=>S.transactions.filter(x=>x.date?.slice(0,7)===month()),sum=(a,f)=>a.reduce((v,x)=>v+f(x),0),inc=a=>sum(a.filter(x=>x.type==='income'),x=>+x.amount),out=a=>sum(a.filter(x=>x.type==='expense'),x=>+x.amount),bal=()=>+(S.settings?.startBalance||0)+sum(S.transactions,x=>(x.type==='income'?1:-1)*+x.amount);
function save(msg){localStorage.setItem(K2,JSON.stringify(S));render();if(msg)toast(msg)}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
function tab(t){T=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();scrollTo({top:0,behavior:'smooth'})}
function open(title,body){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=body;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function head(title,act='',fn=''){return `<div class="head"><h2>${title}</h2>${act?`<button class="link" onclick="${fn}">${act}</button>`:''}</div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function row(x){return `<div class="item"><div class="left"><div class="avatar">${x.type==='income'?'↗':'↘'}</div><div style="min-width:0"><div class="title">${esc(x.title||x.category)}</div><div class="meta">${esc(x.category)} · ${x.date}</div></div></div><b class="amount ${x.type==='income'?'positive':'negative'}">${x.type==='income'?'+':'−'}${money(x.amount)}</b></div>`}
function chart(){let a=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let m=d.toISOString().slice(0,7);a.push({m,v:out(S.transactions.filter(x=>x.type==='expense'&&x.date?.slice(0,7)===m))})}let max=Math.max(1,...a.map(x=>x.v));return `<div class="chart">${a.map(x=>`<div class="barcol"><div class="bar" style="height:${Math.max(3,x.v/max*100)}%"></div><span class="barlabel">${x.m.slice(5)}</span></div>`).join('')}</div>`}
function goalCard(g){let p=Math.min(100,g.saved/g.target*100);return `<div class="panel" style="margin-bottom:9px"><div class="row"><b>${esc(g.name)}</b><span class="tiny">${Math.round(p)}%</span></div><div class="row" style="margin-top:10px"><b>${money(g.saved)}</b><span class="tiny">из ${money(g.target)}</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="row tiny"><span>${g.date?'До '+g.date:'Без срока'}</span><button class="linkbtn" onclick="goalAdd('${g.id}')">Пополнить +</button></div></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="fade">${T==='home'?home():T==='transactions'?transactions():T==='budgets'?budgets():T==='debts'?debts():more()}</div>`}
function home(){let m=mt(),i=inc(m),o=out(m),due=sum(S.debts,x=>+x.remaining),saved=sum(S.goals,x=>+x.saved),b=S.budgets.find(x=>x.category==='Все расходы');return `<div><div class="eyebrow">ВАШИ ФИНАНСЫ</div><h1>Обзор</h1><div class="sub">${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div></div><section class="hero"><div class="row"><span class="sub" style="color:#c1d8c8">Общий баланс</span><span>◈</span></div><div class="balance">${money(bal())}</div><div class="twocol"><div class="hstat"><span class="tiny">Доходы · месяц</span><b class="positive">+${money(i)}</b></div><div class="hstat"><span class="tiny">Расходы · месяц</span><b class="negative">−${money(o)}</b></div></div></section><div class="quick"><button onclick="txForm('income')"><span class="qicon">＋</span>Доход</button><button onclick="txForm('expense')"><span class="qicon">↘</span>Расход</button><button onclick="goalForm()"><span class="qicon">◎</span>Цель</button><button onclick="debtForm()"><span class="qicon">▣</span>Кредит</button></div><section class="section twocol"><div class="metric"><span class="tiny">Кредиты и долги</span><strong>${money(due)}</strong><span class="tiny">${S.debts.length} обязательств</span></div><div class="metric"><span class="tiny">Накопления</span><strong>${money(saved)}</strong><span class="tiny">${S.goals.length} целей</span></div></section>${b?`<section class="panel section"><div class="row"><b>Месячный лимит</b><b>${money(b.limit)}</b></div><div class="progress ${o/b.limit>=.9?'red':''}"><i style="width:${Math.min(100,o/b.limit*100)}%"></i></div><div class="row tiny"><span>Потрачено ${money(o)}</span><span>Осталось ${money(Math.max(0,b.limit-o))}</span></div></section>`:''}<section class="section">${head('Динамика расходов','Аналитика →',"tab('more')")}<div class="panel"><div class="tiny">Расходы за последние 6 месяцев</div>${chart()}</div></section><section class="section">${head('Последние операции','Все →',"tab('transactions')")}${S.transactions.length?`<div class="list">${S.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(row).join('')}</div>`:empty('Добавьте первую операцию, чтобы увидеть финансовую картину.')}</section><section class="section">${head('Цели накоплений','Все →',"tab('more')")}${S.goals.length?S.goals.slice(0,2).map(goalCard).join(''):empty('Создайте цель — резерв, отпуск или покупка.')}</section>`}
function transactions(){let a=S.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));if(F==='month')a=a.filter(x=>x.date?.slice(0,7)===month());return `<div class="row"><div><div class="eyebrow">ИСТОРИЯ ДЕНЕГ</div><h1>Операции</h1></div><button class="btn small" onclick="txForm()">＋ Добавить</button></div><div class="segment"><button class="${F==='month'?'active':''}" onclick="F='month';render()">Этот месяц</button><button class="${F==='all'?'active':''}" onclick="F='all';render()">Всё время</button></div>${a.length?`<div class="list">${a.map(row).join('')}</div>`:empty('Операций за выбранный период пока нет.')}`}
function budgets(){let o=out(mt());return `<div class="row"><div><div class="eyebrow">КОНТРОЛЬ РАСХОДОВ</div><h1>Бюджеты</h1></div><button class="btn small" onclick="budgetForm()">＋ Лимит</button></div><div class="panel section"><span class="tiny">Расходы за месяц</span><div style="font-size:30px;font-weight:800;margin:5px 0">${money(o)}</div><span class="tiny">${mt().filter(x=>x.type==='expense').length} расходных операций</span></div>${S.budgets.length?S.budgets.map(b=>{let used=b.category==='Все расходы'?o:out(mt().filter(x=>x.category===b.category)),p=Math.min(100,used/b.limit*100);return `<div class="panel section"><div class="row"><b>${esc(b.category)}</b><button class="linkbtn" onclick="editBudget('${b.id}')">Изменить</button></div><div class="row tiny" style="margin-top:8px"><span>Потрачено ${money(used)}</span><b>${money(b.limit)}</b></div><div class="progress ${p>=90?'red':''}"><i style="width:${p}%"></i></div><div class="tiny">${Math.round(p)}% лимита использовано</div></div>`}).join(''):empty('Задайте общий лимит или бюджет для отдельной категории.')}`}
function debts(){return `<div class="row"><div><div class="eyebrow">ОБЯЗАТЕЛЬСТВА</div><h1>Кредиты</h1></div><button class="btn small" onclick="debtForm()">＋ Добавить</button></div><div class="twocol section"><div class="metric"><span class="tiny">Остаток долгов</span><strong>${money(sum(S.debts,x=>+x.remaining))}</strong></div><div class="metric"><span class="tiny">Платежи в месяц</span><strong>${money(sum(S.debts,x=>+x.payment))}</strong></div></div>${S.debts.length?S.debts.map(d=>`<div class="panel section"><div class="row"><b>${esc(d.name)}</b><span class="tiny">${d.remaining<=0?'Погашен':'Активен'}</span></div><div class="row" style="margin-top:13px"><span class="tiny">Остаток</span><b>${money(d.remaining)}</b></div><div class="progress"><i style="width:${Math.min(100,Math.max(0,(d.original-d.remaining)/Math.max(1,d.original)*100))}%"></i></div><div class="row tiny"><span>Платёж ${money(d.payment)} · ${esc(d.due||'дата не задана')}</span><button class="linkbtn" onclick="debtPayment('${d.id}')">Внести платёж</button></div></div>`).join(''):empty('Добавьте кредит, рассрочку или личный долг.')}`}
function more(){return `<div><div class="eyebrow">ПЛАНИРОВАНИЕ</div><h1>Ещё</h1></div><section class="section">${head('Накопления','＋ Цель',"goalForm()")}${S.goals.length?S.goals.map(goalCard).join(''):empty('Пока нет целей накопления.')}</section><section class="section">${head('План зарплаты','Настроить',"salaryForm()")}<div class="panel"><span class="tiny">Ожидаемая зарплата</span><div style="font-size:24px;font-weight:800;margin:5px 0">${S.salary.amount?money(S.salary.amount):'Не задана'}</div><span class="tiny">${S.salary.frequency==='twice'?'Дважды в месяц':S.salary.frequency==='weekly'?'Еженедельно':'Ежемесячно'} · число ${S.salary.date}</span><p class="sub">План зарплаты — ориентир. Баланс меняется только после добавления фактического дохода.</p></div></section><section class="section">${head('Регулярные платежи','＋ Добавить',"recurringForm()")}${S.recurring.length?S.recurring.map(r=>`<div class="item"><div><b>${esc(r.name)}</b><div class="meta">${esc(r.category)} · ${r.day}-е число</div></div><b>${money(r.amount)}</b></div>`).join(''):empty('Добавьте аренду, подписки и другие повторяющиеся платежи.')}</section><section class="section">${head('Аналитика')}<div class="panel"><div class="row"><span class="sub">Доходы за всё время</span><b class="positive">+${money(inc(S.transactions))}</b></div><div class="row" style="margin-top:12px"><span class="sub">Расходы за всё время</span><b class="negative">−${money(out(S.transactions))}</b></div><div class="row" style="margin-top:12px"><span class="sub">Денежный поток</span><b>${money(inc(S.transactions)-out(S.transactions))}</b></div></div></section><section class="section">${head('Данные и безопасность')}<div class="panel"><b>Данные хранятся на устройстве</b><p class="sub">Код приложения находится на GitHub, финансовая история — только в локальном хранилище Safari/PWA. Регулярно экспортируйте резервную копию.</p><div class="list"><button class="btn secondary" onclick="exportData()">⇩ Экспортировать резервную копию</button><button class="btn secondary" onclick="document.getElementById('imp').click()">Импортировать резервную копию</button><input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(event)"></div></div></section>`}
function txForm(type='expense'){open(type==='income'?'Новый доход':'Новый расход',`<form onsubmit="addTx(event,'${type}')"><label>Название</label><input name="title" required placeholder="Например, зарплата или продукты"><div class="formgrid"><div><label>Сумма (${S.currency})</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>Дата</label><input name="date" type="date" value="${today()}" required></div></div><label>Категория</label><select name="category">${(type==='income'?['Зарплата','Подработка','Подарок','Возврат','Другое']:['Продукты','Жильё','Транспорт','Покупки','Здоровье','Развлечения','Связь','Кредиты','Образование','Путешествия','Кафе','Подписки','Другое']).map(x=>`<option>${x}</option>`).join('')}</select><label>Комментарий</label><input name="note" placeholder="Необязательно"><div class="actions"><button class="btn">Сохранить</button><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button></div></form>`)}
function addTx(e,t){e.preventDefault();let f=new FormData(e.target);S.transactions.push({id:uid(),type:t,title:f.get('title'),amount:+f.get('amount'),date:f.get('date'),category:f.get('category'),note:f.get('note')});save('Операция добавлена');closeModal()}
function budgetForm(){open('Новый бюджет',`<form onsubmit="addBudget(event)"><label>Категория</label><select name="category">${['Все расходы','Продукты','Жильё','Транспорт','Покупки','Здоровье','Развлечения','Связь','Кредиты','Образование','Путешествия','Кафе','Подписки','Другое'].map(x=>`<option>${x}</option>`).join('')}</select><label>Месячный лимит</label><input name="limit" type="number" min="1" required><div class="actions"><button class="btn">Сохранить</button><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button></div></form>`)}
function addBudget(e){e.preventDefault();let f=new FormData(e.target),c=f.get('category');S.budgets=S.budgets.filter(x=>x.category!==c);S.budgets.push({id:uid(),category:c,limit:+f.get('limit')});save('Бюджет сохранён');closeModal()}
function editBudget(id){let b=S.budgets.find(x=>x.id===id);open('Изменить бюджет',`<form onsubmit="event.preventDefault();S.budgets.find(x=>x.id==='${id}').limit=+this.limit.value;save('Бюджет обновлён');closeModal()"><label>Лимит</label><input name="limit" type="number" value="${b.limit}" min="1" required><div class="actions"><button class="btn">Сохранить</button><button type="button" class="btn secondary" onclick="S.budgets=S.budgets.filter(x=>x.id!=='${id}');save('Удалено');closeModal()">Удалить</button></div></form>`)}
function debtForm(){open('Новое обязательство',`<form onsubmit="addDebt(event)"><label>Название</label><input name="name" required placeholder="Кредит, рассрочка, долг"><div class="formgrid"><div><label>Первоначальная сумма</label><input name="original" type="number" min="1" required></div><div><label>Остаток</label><input name="remaining" type="number" min="0" required></div></div><div class="formgrid"><div><label>Платёж в месяц</label><input name="payment" type="number" min="0" required></div><div><label>Дата платежа</label><input name="due" placeholder="Например, 15 число"></div></div><div class="actions"><button class="btn">Сохранить</button><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button></div></form>`)}
function addDebt(e){e.preventDefault();let f=new FormData(e.target);S.debts.push({id:uid(),name:f.get('name'),original:+f.get('original'),remaining:+f.get('remaining'),payment:+f.get('payment'),due:f.get('due')});save('Добавлено');closeModal()}
function debtPayment(id){let d=S.debts.find(x=>x.id===id);open('Платёж по кредиту',`<p class="sub">${esc(d.name)} · остаток ${money(d.remaining)}</p><form onsubmit="payDebt(event,'${id}')"><label>Сумма</label><input name="amount" type="number" min=".01" max="${d.remaining}" value="${Math.min(d.payment||d.remaining,d.remaining)}" required><label>Дата</label><input name="date" type="date" value="${today()}"><div class="actions"><button class="btn">Учесть платёж</button><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button></div></form>`)}
function payDebt(e,id){e.preventDefault();let f=new FormData(e.target),a=+f.get('amount'),d=S.debts.find(x=>x.id===id);d.remaining=Math.max(0,d.remaining-a);S.transactions.push({id:uid(),type:'expense',title:'Платёж: '+d.name,amount:a,date:f.get('date'),category:'Кредиты'});save('Платёж учтён');closeModal()}
function goalForm(){open('Новая цель',`<form onsubmit="addGoal(event)"><label>Название</label><input name="name" required placeholder="Финансовая подушка, отпуск…"><div class="formgrid"><div><label>Целевая сумма</label><input name="target" type="number" min="1" required></div><div><label>Уже накоплено</label><input name="saved" type="number" min="0" value="0"></div></div><label>Желаемая дата</label><input name="date" type="date"><div class="actions"><button class="btn">Создать</button><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button></div></form>`)}
function addGoal(e){e.preventDefault();let f=new FormData(e.target);S.goals.push({id:uid(),name:f.get('name'),target:+f.get('target'),saved:+f.get('saved'),date:f.get('date')});save('Цель создана');closeModal()}
function goalAdd(id){let g=S.goals.find(x=>x.id===id);open('Пополнить цель',`<p class="sub">${esc(g.name)} · ${money(g.saved)} из ${money(g.target)}</p><form onsubmit="event.preventDefault();S.goals.find(x=>x.id==='${id}').saved+=+this.amount.value;save('Цель пополнена');closeModal()"><label>Сумма</label><input name="amount" type="number" min=".01" required><div class="actions"><button class="btn">Пополнить</button><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button></div></form>`)}
function salaryForm(){open('План зарплаты',`<form onsubmit="event.preventDefault();let f=new FormData(this);S.salary={amount:+f.get('amount'),frequency:f.get('frequency'),date:+f.get('date')};save('План зарплаты сохранён');closeModal()"><label>Ожидаемая зарплата</label><input name="amount" type="number" min="0" value="${S.salary.amount}" required><label>Периодичность</label><select name="frequency"><option value="monthly">Раз в месяц</option><option value="twice">Дважды в месяц</option><option value="weekly">Еженедельно</option></select><label>Число поступления</label><input name="date" type="number" min="1" max="31" value="${S.salary.date}" required><div class="actions"><button class="btn">Сохранить</button><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button></div></form>`)}
function recurringForm(){open('Регулярный платёж',`<form onsubmit="event.preventDefault();let f=new FormData(this);S.recurring.push({id:uid(),name:f.get('name'),amount:+f.get('amount'),day:+f.get('day'),category:f.get('category')});save('Платёж добавлен');closeModal()"><label>Название</label><input name="name" required placeholder="Аренда, подписка, интернет"><div class="formgrid"><div><label>Сумма</label><input name="amount" type="number" min=".01" required></div><div><label>Число месяца</label><input name="day" type="number" min="1" max="31" value="1"></div></div><label>Категория</label><select name="category"><option>Жильё</option><option>Связь</option><option>Кредиты</option><option>Подписки</option><option>Другое</option></select><div class="actions"><button class="btn">Сохранить</button><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button></div></form>`)}
function settings(){open('Настройки',`<label>Валюта</label><select id="cur">${['₽','€','$','₸','₴'].map(x=>`<option ${S.currency===x?'selected':''}>${x}</option>`).join('')}</select><label>Начальный баланс</label><input id="start" type="number" value="${S.settings.startBalance||0}"><p class="tiny">Валюта меняет отображение, автоматической конвертации нет.</p><div class="actions"><button class="btn" onclick="S.currency=document.getElementById('cur').value;S.settings.startBalance=+document.getElementById('start').value;save('Настройки сохранены');closeModal()">Сохранить</button><button class="btn secondary" onclick="closeModal()">Закрыть</button></div>`)}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='balans-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.transactions)||!Array.isArray(d.goals)||!Array.isArray(d.debts))throw 0;S={...fresh(),...d};save('Резервная копия восстановлена')}catch(x){alert('Не удалось прочитать резервную копию Баланс')} };r.readAsText(f);e.target.value=''}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
